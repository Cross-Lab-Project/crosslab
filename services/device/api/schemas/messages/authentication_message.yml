# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
title: Authentication Message
allOf:
  - $ref: './message.yml'
  - type: object
    properties:
      messageType:
        const: authenticate
      token:
        type: string
        writeOnly: true
      deviceUrl:
        type: string
        writeOnly: true
      services:
        type: array
        items: 
          $ref: ../devices/services/service_description.yml
        writeOnly: true
      authenticated:
        type: boolean
        readOnly: true
    required:
      - messageType
      - deviceUrl
      - token
      - authenticated
      - services
x-typeguard: true
