title: Device Changed Event Callback
allOf:
  - $ref: ./event_callback.yml
  - type: object
    properties:
      eventType:
        type: string
        enum:
          - device-changed
      device:
        anyOf:
          - $ref: ../devices/device_cloud_instantiable.yml
          - $ref: ../devices/device_edge_instantiable.yml
          - $ref: ../devices/device_concrete.yml
          - allOf:
              - $ref: ../devices/device_group.yml
              - type: object
                properties:
                  added:
                    type: array
                    items:
                      type: string
                      format: uri
                  changed:
                    type: array
                    items:
                      type: string
                      format: uri
                  removed:
                    type: array
                    items:
                      type: string
                      format: uri
                required:
                  - added
                  - changed
                  - removed
    required:
      - eventType
      - device
x-typeguard: true
