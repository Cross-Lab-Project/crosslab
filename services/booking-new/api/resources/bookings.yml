# yaml-language-server: $schema=https://cross-lab-project.github.io/crosslab/meta-schemas/openapi-resource.json
get:
  operationId: list_bookings
  summary: List bookings
  tags:
    - booking
  security:
    - JWT:
        - booking
        - booking:read
  responses:
    200:
      description: The list of all bookings.
      content:
        application/json:
          $ref: '../content/booking_list.yml'
    400:
      description: Bad Request.
    401:
      description: Unauthorized.
    403:
      description: Forbidden.
    404:
      description: Resource not found.
    500:
      description: Server Error.
  x-optional-url: true
post:
  operationId: create_booking
  summary: Create a booking
  tags:
    - booking
  security:
    - JWT:
        - booking
        - booking:create
  requestBody:
    description: The booking to be created.
    required: true
    content:
      application/json:
        $ref: '../content/booking.yml'
  responses:
    201:
      description: The booking was created. A JSON representation of the new booking is returned.
      content:
        application/json:
          $ref: '../content/booking.yml'
    400:
      description: Bad Request.
    401:
      description: Unauthorized.
    403:
      description: Forbidden.
    404:
      description: Resource not found.
    500:
      description: Server Error.
  x-optional-url: true
