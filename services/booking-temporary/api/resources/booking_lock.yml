# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2025-02-13#/$defs/path-item
put:
  operationId: lock_booking
  summary: Lock a booking
  tags:
    - booking
  security:
    - JWT:
        - booking
  parameters:
    - $ref: '../parameters/booking_id.yml'
  responses:
    200:
      description: The booking was locked successfully.
      content:
        application/json:
          $ref: '../content/device_list.yml'
    400:
      description: Bad Request.
    401:
      description: Unauthorized.
    403:
      description: Forbidden.
    404:
      description: Resource not found.
    500:
      description: Server Error.
