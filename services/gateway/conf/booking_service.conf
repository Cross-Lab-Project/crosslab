location = /booking/status {
    limit_except get options { deny all; }

    proxy_pass http://booking_service;
}

location = /schedule {
    limit_except post options { deny all; }
    auth_request @auth;
    auth_request_set $authentication $upstream_http_x_request_authentication;

    proxy_set_header X-Request-Authentication $authentication;
    proxy_set_header X-Request-ID $request_id;
    proxy_pass http://booking_service;
}

location = /bookings {
    limit_except post get options { deny all; }
    auth_request @auth;
    auth_request_set $authentication $upstream_http_x_request_authentication;

    proxy_set_header X-Request-Authentication $authentication;
    proxy_set_header X-Request-ID $request_id;
    proxy_pass http://booking_service;
}

location ~ ^/bookings/[^/]+$ {
    limit_except get delete patch options { deny all; }
    auth_request @auth;
    auth_request_set $authentication $upstream_http_x_request_authentication;

    proxy_set_header X-Request-Authentication $authentication;
    proxy_set_header X-Request-ID $request_id;
    proxy_pass http://booking_service;
}

location ~ ^/bookings/[^/]+/lock$ {
    limit_except put delete options { deny all; }
    auth_request @auth;
    auth_request_set $authentication $upstream_http_x_request_authentication;

    proxy_set_header X-Request-Authentication $authentication;
    proxy_set_header X-Request-ID $request_id;
    proxy_pass http://booking_service;
}

location  = /callbacks/booking {
    limit_except post options { deny all; }
    auth_request @auth;
    auth_request_set $authentication $upstream_http_x_request_authentication;

    proxy_set_header X-Request-Authentication $authentication;
    proxy_set_header X-Request-ID $request_id;
    proxy_pass http://booking_service;
}